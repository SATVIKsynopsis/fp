[package]
name = "fp"
version = "0.1.0"
edition = "2024"
description = "A simple interactive media compression CLI powered by FFmpeg"
license = "MIT"
repository = "https://github.com/SATVIKsynopsis/fp"
readme = "README.md"
keywords = ["ffmpeg", "video", "compression", "cli", "media"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"